# ❀ garden snake + neofetch stats ❀
# Gera a cobrinha e o painel de estatísticas na branch "output" a cada 12h.

name: garden snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/garden-snake.svg?color_snake=#C97B84&color_dots=#F5EDE3,#F4C2C2,#E8A0A8,#B5CDA3,#7A9A6B
            dist/garden-snake-dark.svg?palette=github-dark&color_snake=#F4C2C2&color_dots=#1E1A17,#5C4033,#8B6F5A,#A8C69F,#E8A0A8

      - name: build terminal panels
        run: python .github/scripts/profile_panels.py "${{ github.repository_owner }}" dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
